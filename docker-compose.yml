# Запуск на сервере (из корня репозитория, рядом лежит backend/.env):
#   docker compose up -d --build
# Сайт отдаётся контейнером web через общий Caddy (сеть edge должна существовать);
# на порту хоста WEB_PORT (по умолчанию 8080) — только с 127.0.0.1.

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  mongo:
    <<: *logging
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *logging
    build: ./backend
    restart: always
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      ENABLE_HTTPS: "false"
      MONGODB_URI: mongodb://mongo:27017/miracle_tea
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: 512m

  web:
    <<: *logging
    build: ./frontend
    restart: always
    # Наружу сайт отдаёт общий Caddy сервера (сеть edge, имя miracle-tea-web);
    # порт хоста открыт только локально — для проверки с самого сервера.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      default: {}
      edge:
        aliases: [miracle-tea-web]
    depends_on:
      - backend
    mem_limit: 128m

networks:
  edge:
    external: true

volumes:
  mongo-data:
